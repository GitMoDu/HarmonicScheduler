<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Harmonic Timeline</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #181818;
            color: #ddd;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #toolbar {
            flex-shrink: 0;
            background: #1e1e1e;
            border-bottom: 1px solid #333;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
        }

            #toolbar h1 {
                font-size: 14px;
                color: #7af;
                margin-right: 4px;
                letter-spacing: 1px;
            }

        button {
            background: #252525;
            color: #bbb;
            border: 1px solid #444;
            padding: 5px 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            border-radius: 2px;
        }

            button:hover:enabled {
                background: #333;
                color: #fff;
            }

            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

        label {
            color: #999;
        }

        select {
            background: #252525;
            color: #bbb;
            border: 1px solid #444;
            padding: 4px 8px;
            font-family: inherit;
            font-size: 12px;
            border-radius: 2px;
        }

        #status {
            margin-left: auto;
            color: #666;
            font-size: 12px;
        }

        #main {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        #canvas-wrap {
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: grab;
        }

            #canvas-wrap.dragging {
                cursor: grabbing;
            }

        canvas {
            display: block;
        }

        #tip {
            position: fixed;
            display: none;
            background: #222;
            border: 1px solid #555;
            border-radius: 3px;
            padding: 8px 12px;
            font-size: 12px;
            line-height: 1.6;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <h1>⚡ TIMELINE</h1>
        <button id="connect">Connect</button>
        <button id="clear">Clear</button>
        <label for="baudRate">Baud:</label>
        <select id="baudRate">
            <option value="9600">9600</option>
            <option value="19200">19200</option>
            <option value="57600">57600</option>
            <option value="115200">115200</option>
            <option value="230400">230400</option>
            <option value="250000">250000</option>
            <option value="460800">460800</option>
            <option value="500000">500000</option>
            <option value="921600">921600</option>
            <option value="1000000" selected>1000000</option>
            <option value="1500000">1.5M</option>
            <option value="2000000">2M</option>
        </select>
        <span id="status">Idle</span>
    </div>
    <div id="main">
        <div id="canvas-wrap">
            <canvas id="c"></canvas>
        </div>
    </div>
    <div id="tip"></div>

    <script>
        const wrap = document.getElementById("canvas-wrap");
        const cv = document.getElementById("c");
        const ctx = cv.getContext("2d");
        const connectButton = document.getElementById("connect");
        const baudRateSelect = document.getElementById("baudRate");
        const statusText = document.getElementById("status");
        const tip = document.getElementById("tip");

        let W, H, dpr = 1, port, reader, connected = false;
        let tasks = {}, intervals = [], scale = 0.1, offset = 0;
        let verticalOffset = 0, laneZoom = 1;
        let drag = false, dragMode = "horizontal", lastx = 0, lasty = 0;
        let drawScheduled = false, drawDirty = false;
        let visibleTaskIdsCache = [], visibleTaskIdsDirty = true;
        let intervalsByHandle = new Map();
        let hasPreviousSample = false;
        let previousSampleTimestamp = 0;
        let lastSampleDelta = 1;
        const decoder = new TextDecoder();

        const LABEL_WIDTH = 160;
        const AXIS_HEIGHT = 42;
        const LANE_TOP = 12;
        const BASE_LANE_HEIGHT = 38;
        const BASE_BAR_HEIGHT = 24;
        const MIN_OFFSET = -1000000;
        const MIN_LANE_ZOOM = 0.55;
        const MAX_LANE_ZOOM = 2.5;

        function scheduleDraw() {
        drawDirty = true;
        if (drawScheduled) return;
        drawScheduled = true;
        requestAnimationFrame(() => {
        drawScheduled = false;
        if (!drawDirty) return;
        drawDirty = false;
        draw();
        });
        }

        function clampOffset(val) {
            return Math.max(MIN_OFFSET, val);
        }

        function getVisibleTaskIds() {
        if (!visibleTaskIdsDirty) return visibleTaskIdsCache;
        const ids = new Set(Object.keys(tasks).map(Number));
        for (const handle of intervalsByHandle.keys()) ids.add(handle);
        visibleTaskIdsCache = [...ids].sort((a, b) => a - b);
        visibleTaskIdsDirty = false;
        return visibleTaskIdsCache;
        }

        function getLaneHeight() {
        return BASE_LANE_HEIGHT * laneZoom;
        }

        function getBarHeight() {
        return Math.max(6, BASE_BAR_HEIGHT * laneZoom);
        }

        function getContentHeight(taskCount) {
        return AXIS_HEIGHT + LANE_TOP + taskCount * getLaneHeight() + 8;
        }

        function clampVerticalOffset(val, taskCount = getVisibleTaskIds().length) {
        const maxOffset = Math.max(0, getContentHeight(taskCount) - H);
        return Math.max(0, Math.min(maxOffset, val));
        }

        function normalizeWheelDelta(event) {
        const base = Math.abs(event.deltaY) >= Math.abs(event.deltaX) ? event.deltaY : event.deltaX;
        if (event.deltaMode === 1) return base * 16;
        if (event.deltaMode === 2) return base * Math.max(1, H * 0.9);
        return base;
        }

        function appendInterval(interval) {
        intervals.push(interval);
        let laneIntervals = intervalsByHandle.get(interval.h);
        if (!laneIntervals) {
        laneIntervals = [];
        intervalsByHandle.set(interval.h, laneIntervals);
        visibleTaskIdsDirty = true;
        }
        laneIntervals.push(interval);
        }

        function ingestSample(timestamp, handle) {
        if (hasPreviousSample) {
        const previousOpen = intervals[intervals.length - 1];
        if (previousOpen && previousOpen.open) {
        previousOpen.w = Math.max(1, timestamp - previousOpen.x);
        previousOpen.open = false;
        }
        lastSampleDelta = Math.max(1, timestamp - previousSampleTimestamp);
        } else {
        hasPreviousSample = true;
        }

        previousSampleTimestamp = timestamp;
        appendInterval({ x: timestamp, w: lastSampleDelta, h: handle, open: true });
        verticalOffset = clampVerticalOffset(verticalOffset);
        }

        function findIntervalAtTimestamp(laneIntervals, timestamp) {
        let left = 0;
        let right = laneIntervals.length - 1;

        while (left <= right) {
        const mid = (left + right) >> 1;
        const iv = laneIntervals[mid];
        const end = iv.x + iv.w;

        if (timestamp < iv.x) {
        right = mid - 1;
        } else if (timestamp > end) {
        left = mid + 1;
        } else {
        return iv;
        }
        }

        return null;
        }

        function resize() {
        dpr = window.devicePixelRatio || 1;
        W = wrap.clientWidth;
        H = wrap.clientHeight;

        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        cv.style.width = `${W}px`;
        cv.style.height = `${H}px`;

        verticalOffset = clampVerticalOffset(verticalOffset);
        scheduleDraw();
        }

        window.addEventListener("resize", resize);

        function updateConnectionUi() {
        connectButton.textContent = connected ? "Disconnect" : "Connect";
        connectButton.disabled = !connected && !!port;
        baudRateSelect.disabled = connected || !!port;
        }

        function setStatus(text) { statusText.textContent = text; }
        function color(id) { let h = (id * 67) % 360; return `hsl(${h} 70% 55%)`; }
        // Labels come from the timeline header. Do not infer the first state or
        // reserve special handles here; a trace may begin in any state.
        function labelFor(id) { return tasks[id] || `Handle ${id}`; }

        function unitPrecision(stepInUnit, fallback = 2) {
        if (!Number.isFinite(stepInUnit) || stepInUnit <= 0) return fallback;
        return Math.max(0, Math.min(6, Math.ceil(-Math.log10(stepInUnit)) + 1));
        }

        function getTimeUnit(referenceStep, value) {
        if (referenceStep > 0) {
        if (referenceStep >= 1000000) return { divisor: 1000000, suffix: " s", step: referenceStep / 1000000, fallback: 3 };
        if (referenceStep >= 1000) return { divisor: 1000, suffix: " ms", step: referenceStep / 1000, fallback: 2 };
        return { divisor: 1, suffix: " µs", step: referenceStep, fallback: 0 };
        }

        if (Math.abs(value) >= 1000000) return { divisor: 1000000, suffix: " s", step: 1, fallback: 2 };
        if (Math.abs(value) >= 1000) return { divisor: 1000, suffix: " ms", step: 1, fallback: 2 };
        return { divisor: 1, suffix: " µs", step: 1, fallback: 0 };
        }

        function formatTime(value, referenceStep = 0) {
        const unit = getTimeUnit(referenceStep, value);
        return `${(value / unit.divisor).toFixed(unitPrecision(unit.step, unit.fallback))}${unit.suffix}`;
        }

        function drawTimeAxis() {
        const visibleStart = offset;
        const visibleEnd = offset + (W - LABEL_WIDTH) / scale;
        const targetTickTime = 130 / scale;
        const magnitude = Math.pow(10, Math.floor(Math.log10(Math.max(1, targetTickTime))));
        const normalized = targetTickTime / magnitude;
        const multiplier = normalized <= 1 ? 1 : normalized <= 2 ? 2 : normalized <= 5 ? 5 : 10;
        const tickStep = magnitude * multiplier;
        const firstTick = Math.ceil(visibleStart / tickStep) * tickStep;

        ctx.fillStyle = "#181818";
        ctx.fillRect(0, 0, W, AXIS_HEIGHT);
        ctx.strokeStyle = "#555";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(LABEL_WIDTH, AXIS_HEIGHT - 0.5);
        ctx.lineTo(W, AXIS_HEIGHT - 0.5);
        ctx.stroke();

        ctx.font = "15px 'Courier New', monospace";
        ctx.textAlign = "center";
        for (let timestamp = firstTick; timestamp <= visibleEnd; timestamp += tickStep) {
        const x = Math.round((timestamp - offset) * scale + LABEL_WIDTH);
        ctx.strokeStyle = "#555";
        ctx.beginPath();
        ctx.moveTo(x - 0.5, AXIS_HEIGHT - 10);
        ctx.lineTo(x - 0.5, AXIS_HEIGHT);
        ctx.stroke();
        ctx.fillStyle = "#ddd";
        ctx.fillText(formatTime(timestamp, tickStep), x, 22);
        }
        ctx.textAlign = "left";
        }

        function draw() {
        ctx.save();
        // Scale context by DPR to map logical coordinates crisp to physical pixels
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, W, H);

        drawTimeAxis();

        const ids = getVisibleTaskIds();
        const laneHeight = getLaneHeight();
        const barHeight = getBarHeight();
        const laneBaseY = AXIS_HEIGHT + LANE_TOP - verticalOffset;
        const labelFontSize = Math.max(12, Math.min(16, Math.round(16 * laneZoom)));
        const visibleStart = offset;
        const visibleEnd = offset + (W - LABEL_WIDTH) / scale;

        ctx.save();
        ctx.beginPath();
        ctx.rect(LABEL_WIDTH, AXIS_HEIGHT, W - LABEL_WIDTH, H - AXIS_HEIGHT);
        ctx.clip();

        ids.forEach((id, idx) => {
        const y = laneBaseY + idx * laneHeight;
        if (y > H || y + laneHeight < AXIS_HEIGHT) return;

        ctx.strokeStyle = "#282828";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(LABEL_WIDTH, y + laneHeight - 0.5);
        ctx.lineTo(W, y + laneHeight - 0.5);
        ctx.stroke();

        const laneIntervals = intervalsByHandle.get(id) || [];
        let left = 0;
        let right = laneIntervals.length - 1;
        let firstVisibleIdx = laneIntervals.length;
        while (left <= right) {
        const mid = (left + right) >> 1;
        const iv = laneIntervals[mid];
        const intervalEnd = iv.x + iv.w;
        if (intervalEnd < visibleStart) {
        left = mid + 1;
        } else {
        firstVisibleIdx = mid;
        right = mid - 1;
        }
        }

        for (let i = firstVisibleIdx; i < laneIntervals.length; i++) {
        const iv = laneIntervals[i];
        if (iv.x > visibleEnd) break;

        const x = (iv.x - offset) * scale + LABEL_WIDTH;
        const w = Math.max(1, iv.w * scale);
        ctx.fillStyle = color(id);
        ctx.fillRect(x, y, w, barHeight);
        }
        });
        ctx.restore();

        ids.forEach((id, idx) => {
        const y = laneBaseY + idx * laneHeight;
        if (y > H || y + laneHeight < AXIS_HEIGHT) return;

        ctx.fillStyle = "#181818";
        ctx.fillRect(0, y - 6, LABEL_WIDTH - 12, barHeight + 8);

        ctx.fillStyle = "#ddd";
        ctx.font = `${labelFontSize}px 'Courier New', monospace`;
        ctx.fillText(labelFor(id), 12, Math.round(y + barHeight * 0.72));
        });

        ctx.restore();
        }

        wrap.addEventListener("wheel", e => {
        e.preventDefault();
        const rect = cv.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const ids = getVisibleTaskIds();
        const wheelDelta = normalizeWheelDelta(e);
        const shiftScrollIntent = e.shiftKey || e.getModifierState("Shift") || (Math.abs(e.deltaX) > Math.abs(e.deltaY) && Math.abs(e.deltaX) > 0);

        if (mouseX < LABEL_WIDTH || mouseY < AXIS_HEIGHT) {
        const oldLaneHeight = getLaneHeight();
        const zoomFactor = wheelDelta < 0 ? 1.12 : 0.9;
        laneZoom = Math.max(MIN_LANE_ZOOM, Math.min(MAX_LANE_ZOOM, laneZoom * zoomFactor));
        const newLaneHeight = getLaneHeight();
        const pivotY = verticalOffset + mouseY - (AXIS_HEIGHT + LANE_TOP);
        if (oldLaneHeight > 0) {
        verticalOffset = (pivotY / oldLaneHeight) * newLaneHeight - (mouseY - (AXIS_HEIGHT + LANE_TOP));
        }
        verticalOffset = clampVerticalOffset(verticalOffset, ids.length);
        scheduleDraw();
        return;
        }

        if (shiftScrollIntent) {
        verticalOffset = clampVerticalOffset(verticalOffset + wheelDelta, ids.length);
        scheduleDraw();
        return;
        }

        const pivotTimestamp = offset + (mouseX - LABEL_WIDTH) / scale;
        const zoomFactor = wheelDelta < 0 ? 1.25 : 0.8;
        scale *= zoomFactor;
        offset = clampOffset(pivotTimestamp - (mouseX - LABEL_WIDTH) / scale);
        scheduleDraw();
        }, { passive: false });

        wrap.addEventListener("mousedown", e => {
        if (e.button !== 0) return;
        const rect = cv.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        drag = true;
        dragMode = mouseX < LABEL_WIDTH ? "vertical" : "horizontal";
        lastx = e.clientX;
        lasty = e.clientY;
        wrap.classList.add("dragging");
        });

        window.addEventListener("mouseup", () => {
        drag = false;
        wrap.classList.remove("dragging");
        });

        window.addEventListener("mousemove", e => {
        if (drag) {
        if (dragMode === "horizontal") {
        const deltaPx = e.clientX - lastx;
        offset = clampOffset(offset - (deltaPx / scale));
        lastx = e.clientX;
        } else {
        const deltaY = e.clientY - lasty;
        verticalOffset = clampVerticalOffset(verticalOffset - deltaY);
        lasty = e.clientY;
        }
        scheduleDraw();
        }

        const rect = cv.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const laneHeight = getLaneHeight();
        const laneIdx = Math.floor((my - (AXIS_HEIGHT + LANE_TOP) + verticalOffset) / laneHeight);

        if (mx < LABEL_WIDTH || my < AXIS_HEIGHT || laneIdx < 0) {
        tip.style.display = "none";
        return;
        }

        const ids = getVisibleTaskIds();
        if (laneIdx >= ids.length) {
        tip.style.display = "none";
        return;
        }

        const ts = offset + (mx - LABEL_WIDTH) / scale;
        const id = ids[laneIdx];
        const laneIntervals = intervalsByHandle.get(id) || [];
        const interval = findIntervalAtTimestamp(laneIntervals, ts);
        if (!interval) {
        tip.style.display = "none";
        return;
        }

        const duration = interval.open ? Math.max(0, ts - interval.x) : interval.w;
        const durationText = formatTime(duration, Math.max(1, 1 / Math.max(scale, 1e-9)));
        const cursorText = formatTime(ts, Math.max(1, 1 / Math.max(scale, 1e-9)));
        const startText = formatTime(interval.x, Math.max(1, interval.w));
        const endText = interval.open ? "…" : formatTime(interval.x + interval.w, Math.max(1, interval.w));

        tip.innerHTML =
        `<span style="color:${color(id)};font-weight:bold">■ ${labelFor(id)}</span><br>` +
        `<span style="color:#9aa">Duration:</span> ${durationText}${interval.open ? " (running)" : ""}<br>` +
        `<span style="color:#9aa">Block:</span> ${startText} → ${endText}<br>` +
        `<span style="color:#9aa">Cursor:</span> ${cursorText}`;
        tip.style.display = "block";
        tip.style.left = `${e.clientX + 16}px`;
        tip.style.top = `${e.clientY - 12}px`;
        });

        wrap.addEventListener("mouseleave", () => { tip.style.display = "none"; });

        function resetTimelineState() {
        tasks = {};
        intervals = [];
        intervalsByHandle = new Map();
        visibleTaskIdsCache = [];
        visibleTaskIdsDirty = true;
        hasPreviousSample = false;
        previousSampleTimestamp = 0;
        lastSampleDelta = 1;
        offset = 0;
        scale = 0.1;
        verticalOffset = 0;
        laneZoom = 1;
        tip.style.display = "none";
        scheduleDraw();
        }

        document.getElementById("clear").onclick = () => {
        resetTimelineState();
        };

        async function disconnect() {
        if (reader) {
        try { await reader.cancel(); } catch (e) {}
        return;
        }
        if (port) {
        try { await port.close(); } catch (e) {}
        port = null;
        connected = false;
        updateConnectionUi();
        setStatus("Disconnected");
        }
        }

        async function readSerial() {
        reader = port.readable.getReader();
        let byteBuf = new Uint8Array(0);
        let mode = "header";

        try {
        while (true) {
        let { value, done } = await reader.read();
        if (done) break;

        let nextBuf = new Uint8Array(byteBuf.length + value.length);
        nextBuf.set(byteBuf, 0);
        nextBuf.set(value, byteBuf.length);
        byteBuf = nextBuf;

        let offsetIdx = 0;

        if (mode === "header") {
        while (offsetIdx < byteBuf.length) {
        let newlineIdx = byteBuf.indexOf(0x0A, offsetIdx);
        if (newlineIdx !== -1) {
        let lineBytes = byteBuf.slice(offsetIdx, newlineIdx);
        let line = decoder.decode(lineBytes).trim();

        if (line === "START") {
        mode = "binary";
        offsetIdx = newlineIdx + 1;
        break;
        }

        let m = line.match(/^(\d+)\s+(.+?)\s*$/);
        if (m) {
        tasks[+m[1]] = m[2];
        visibleTaskIdsDirty = true;
        }

        offsetIdx = newlineIdx + 1;
        } else {
        break;
        }
        }
        }

        if (mode === "binary") {
        // Each sample is four big-endian timestamp bytes followed by a handle.
        // The first sample may represent any timeline state.
        const SAMPLE_SIZE = 5;
        let consumedSamples = false;

        while (offsetIdx + SAMPLE_SIZE <= byteBuf.length) {
        const timestamp = ((byteBuf[offsetIdx]     << 24) |
        (byteBuf[offsetIdx + 1] << 16) |
        (byteBuf[offsetIdx + 2] << 8)  |
        byteBuf[offsetIdx + 3]) >>> 0;
        const handle = byteBuf[offsetIdx + 4];

        ingestSample(timestamp, handle);
        consumedSamples = true;
        offsetIdx += SAMPLE_SIZE;
        }

        if (consumedSamples) scheduleDraw();
        }

        if (offsetIdx > 0) {
        byteBuf = byteBuf.slice(offsetIdx);
        }
        }
        } finally {
        reader.releaseLock();
        reader = null;
        try { await port.close(); } catch (e) {}
        port = null;
        connected = false;
        updateConnectionUi();
        setStatus("Disconnected");
        }
        }

        connectButton.onclick = async () => {
        if (connected) { await disconnect(); return; }
        try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: Number(baudRateSelect.value) });
        resetTimelineState();
        connected = true;
        updateConnectionUi();
        setStatus("Connected");
        await readSerial();
        } catch (e) {
        if (e.name !== "AbortError") setStatus(`Error: ${e.message}`);
        if (reader) await disconnect();
        else if (port) { try { await port.close(); } catch (error) {} port = null; }
        connected = false;
        updateConnectionUi();
        }
        };

        if ("serial" in navigator) {
        navigator.serial.addEventListener("disconnect", event => {
        if (event.target === port) disconnect();
        });
        }

        // Initial setup
        resize();
    </script>
</body>
</html>
